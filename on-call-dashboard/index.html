<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1517">
    <meta name="description" content="Current and upcoming hospital on-call rotas.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ENT On Call">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
    <script>(function(){try{var t=localStorage.getItem('oncall:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}})();</script>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <title>On call</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="On call home">
          <span class="brand-mark" aria-hidden="true">OC</span>
          <span>On call</span>
        </a>
        <div class="topbar-actions">
          <span id="network-state" class="network-state" aria-live="polite">Loading rota…</span>
          <button id="theme-button" class="theme-button" type="button" aria-label="Colour theme: Auto" title="Colour theme: Auto">Auto</button>
          <button id="settings-button" class="theme-button" type="button" aria-haspopup="dialog">Settings</button>
          <button id="install-button" class="install-button" type="button" hidden>Install</button>
        </div>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <div>
            <p class="eyebrow">HOSPITAL ROTAS</p>
            <h1 id="page-title">On-call cover</h1>
            <p id="today-label" class="today-label"></p>
          </div>
          <div class="updated-pill" aria-live="polite">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="updated-label">Checking for updates</span>
          </div>
        </section>

        <nav class="view-switch" role="tablist" aria-label="Rota view">
          <button id="now-tab" class="view-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="now-view">Now</button>
          <button id="month-tab" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="month-view">Coming month</button>
        </nav>

        <section id="now-view" class="view-panel" role="tabpanel" aria-labelledby="now-tab">
          <div class="section-heading">
            <div>
              <p class="eyebrow">ON CALL ROTA DAY</p>
              <h2 id="current-date-heading">Today</h2>
            </div>
            <button id="refresh-button" class="refresh-button" type="button" aria-label="Refresh rota data">
              <span aria-hidden="true">↻</span><span>Refresh</span>
            </button>
          </div>
          <div id="now-rota-list" class="rota-list" aria-live="polite"></div>
        </section>

        <section id="month-view" class="view-panel" role="tabpanel" aria-labelledby="month-tab" hidden>
          <div class="section-heading month-heading">
            <div>
              <p class="eyebrow">PLAN AHEAD</p>
              <h2 id="month-title">Coming month</h2>
            </div>
          </div>
          <section class="date-selection">
            <button id="date-selection-toggle" class="date-selection-toggle" type="button" aria-expanded="false" aria-controls="date-selection-content">
              <span>Search or select date</span><span class="trust-chevron" aria-hidden="true">⌄</span>
            </button>
            <div id="date-selection-content" hidden>
              <p id="month-caption" class="month-caption">Tap a date to see who is on call</p>
              <label class="search-box month-search-box">
                <span class="sr-only">Search dates or names</span>
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="search-input" type="search" placeholder="Search names or dates" autocomplete="off">
                <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" hidden>×</button>
              </label>
              <div id="search-results" class="search-results" aria-live="polite" hidden></div>
              <div class="month-calendar" aria-label="Dates in the coming months">
                <div class="calendar-month-nav">
                  <button id="previous-month" class="calendar-nav-button" type="button" aria-label="Previous month">‹</button>
                  <button id="calendar-month-label" class="calendar-month-label" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="calendar-month-picker"><span id="calendar-month-text"></span><span class="calendar-month-chevron" aria-hidden="true">⌄</span></button>
                  <button id="next-month" class="calendar-nav-button" type="button" aria-label="Next month">›</button>
                </div>
                <div id="calendar-month-picker" class="calendar-month-picker" role="dialog" aria-label="Choose month and year" hidden>
                  <div class="calendar-picker-head"><label for="calendar-year-select">Year</label><select id="calendar-year-select" class="calendar-year-select" aria-label="Choose year"></select></div>
                  <div id="calendar-month-options" class="calendar-month-options" role="group" aria-label="Choose month"></div>
                  <div class="calendar-picker-actions"><button id="calendar-today" type="button" class="calendar-picker-today">Today</button><button id="calendar-picker-close" type="button" class="calendar-picker-close">Close</button></div>
                </div>
                <div class="calendar-weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
                <div id="month-date-grid" class="calendar-grid" role="group" aria-label="Select a date"></div>
              </div>
      <section class="selected-day" aria-live="polite">
                <div class="selected-date-nav">
                  <button id="previous-date" class="calendar-nav-button" type="button" aria-label="Previous date">‹</button>
                  <h3 id="selected-date-title" class="selected-date-title"></h3>
                  <button id="next-date" class="calendar-nav-button" type="button" aria-label="Next date">›</button>
                </div>
                <div id="month-rota-list" class="month-rota-list"></div>
              </section>
            </div>
          </section>
          <section class="next-days">
            <button id="next-days-toggle" class="next-days-toggle" type="button" aria-expanded="false" aria-controls="next-days-list">30-day look ahead<span class="trust-chevron" aria-hidden="true">⌄</span></button>
            <div id="next-days-filter" class="site-filter" role="group" aria-label="Filter 30-day look ahead" hidden>
              <button type="button" data-next-filter="BOTH" aria-pressed="false">Both</button>
              <button type="button" data-next-filter="HGS" aria-pressed="false">HGS</button>
              <button type="button" data-next-filter="QE" aria-pressed="false">QE</button>
            </div>
            <div id="next-days-list" class="next-days-list" hidden></div>
          </section>
        </section>
      </main>

      <footer class="footer">
        <span>Times shown in UK local time</span>
        <button id="footer-refresh" class="text-button" type="button">Refresh rota</button>
      </footer>
    </div>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-head"><h2 id="settings-title">Rota settings</h2><button id="close-settings" class="dialog-close" type="button" aria-label="Close settings">×</button></div>
      <label class="settings-field" for="default-site-filter-setting"><span>Default 30-day view</span><select id="default-site-filter-setting"><option value="BOTH">Both</option><option value="HGS">HGS</option><option value="QE">QE</option></select></label>
      <label class="settings-field" for="first-site-setting"><span>When showing both, list first</span><select id="first-site-setting"><option value="HGS">HGS</option><option value="QE">QE</option></select></label>
      <fieldset class="settings-fieldset"><legend>Open by default</legend>
        <label><input id="qe-open-setting" type="checkbox"> QE</label>
        <label><input id="hgs-open-setting" type="checkbox"> HGS</label>
      </fieldset>
      <div class="settings-actions"><button id="save-settings" class="settings-save" type="button">Save settings</button><button id="cancel-settings" class="settings-cancel" type="button">Cancel</button></div>
    </dialog>

    <script src="./config.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
